apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-shop-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_WITH_ORG/retail-shop-helm.git
    targetRevision: main
    path: bootstrap
    directory:
      recurse: true
      include: "retail-shop-application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

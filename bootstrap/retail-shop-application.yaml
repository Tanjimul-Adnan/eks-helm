apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Tanjimul-Adnan/eks-helm.git
    targetRevision: main
    path: apps/retail-shop
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://zrgocd.xcheetah1.dpdns.org
    namespace: retail-shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

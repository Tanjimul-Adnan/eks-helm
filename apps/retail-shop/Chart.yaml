apiVersion: v2
name: retail-store-sample-chart
description: A Helm chart for the AWS retail store containers sample application
type: application
version: 1.6.3
dependencies:
  - name: retail-store-sample-cart-chart
    alias: cart
    version: 1.6.3
    repository: file://charts-src/cart
  - name: retail-store-sample-catalog-chart
    alias: catalog
    version: 1.6.3
    repository: file://charts-src/catalog
  - name: retail-store-sample-checkout-chart
    alias: checkout
    version: 1.6.3
    repository: file://charts-src/checkout
  - name: retail-store-sample-orders-chart
    alias: orders
    version: 1.6.3
    repository: file://charts-src/orders
  - name: retail-store-sample-ui-chart
    alias: ui
    version: 1.6.3
    repository: file://charts-src/ui
  - name: ingress-nginx
    version: 4.10.0
    repository: https://kubernetes.github.io/ingress-nginx
  - name: cert-manager
    alias: cert-manager
    version: v1.16.2
    repository: https://charts.jetstack.io
